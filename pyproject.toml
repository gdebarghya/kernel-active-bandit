[project]
name = "kabc"
version = "0.1.0"
description = "Benchmark suite for kernel-based active clustering of bandit arms"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]