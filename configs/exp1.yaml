# Experiment 1 -- Gaussian mixtures: competitiveness in the parametric regime.
# See docs/experiments.md, "Experiment 1" section, for the full design.
# This file encodes only the grid/protocol; algorithm and environment
# implementations live in src/kabc/. Consumed by scripts/run_experiment1.py
# -- a dedicated script, not run_experiment.py -- see that script's module
# docstring for why.
#
# Current roster: 6 independent algorithms (kabc, kabc-2x, kabc-0.5x, kabc-sg,
# acb, acb-gaussian); kabc-0.5x/kabc-2x are a calibration-constant ablation
# (c_cal halved/doubled), not budget variants.

exp_id: 1
delta: 0.05                    # confidence level (docs/experiments.md section 0.4)
reps: 100
rep_start: 100                # results hold reps 0-99 already; no-op unless `reps` is raised
                                # (set to 0 to regenerate from scratch)
seed_multiplier: 1000
seed_formula: "seed = seed_multiplier * exp_id + rep"   # docs/experiments.md section 0.4

n_jobs: 10                     # parallelize ACROSS REPS (not across the 6
                                # algorithm rows within one rep) -- see
                                # scripts/run_experiment1.py's module
                                # docstring for the full rationale.

# One family: N arms in K balanced clusters, N(mu_k, sigma^2 I_d), sigma=1,
# cluster means mu_k = Delta/sqrt(2)*(e_{2k-1}+e_{2k}) -- see
# kabc.environments.GaussianMixtureEnv. `base` keys match its constructor
# kwargs exactly (N, K, d, Delta, sigma).
instances:
  - family: gaussian_mixture
    base: {N: 60, K: 3, d: 10, Delta: 3, sigma: 1.0}
    # One knob swept at a time; all other params held at `base`.
    sweeps:
      - param: Delta
        values: [1, 2, 3, 4]     # main plot -- trimmed from [1, 1.5, 2, 3, 4, 6] 2026-10-03
      - param: d
        values: [6, 10, 20, 50]  # trimmed from [6, 10, 50, 100] 2026-10-03
        # d=2 excluded: GaussianMixtureEnv's mean construction requires
        # d >= 2K = 6 for K=3 (each cluster needs its own coordinate pair).
      - param: N
        values: [30, 60, 90, 120]
        # N=90 added 2026-09-14 (permanent, not a one-off pilot point):
        # fills the gap between 60 and 120 on this sweep. Notebook 01's
        # plotting functions all sort_values("swept_value") before
        # plotting, so listing order here doesn't affect the rendered
        # x-axis order.
    # 6 rows per (grid point, rep) -- all independent base algorithms
    # (kabc, kabc-2x, kabc-0.5x, kabc-sg, acb, acb-gaussian), no
    # cross-algorithm tau dependency (unif-kkm, the one row that used to
    # need kabc's tau, was dropped). See docs/experiments.md section 0.1.
    # kabc-0.5x/kabc-2x: an ablation over kabc's calibrated threshold
    # CONSTANT (c_cal halved/doubled), not over budget -- see
    # scripts/common.py's `_kabc_fit_2x`/`_kabc_fit_0p5x` docstrings.
    algorithms:
      [kabc, kabc-2x, kabc-0.5x, kabc-sg, acb, acb-gaussian]
      # No tas-fw here: its finite-alphabet assumption doesn't hold for
      # these continuous Gaussian instances -- see docs/experiments.md.
      # acb-gaussian (kabc.algorithms.acb_gaussian): the ACB paper's own
      # Gaussian-specialized, non-adaptive variant (Appendix A), independent
      # base row, no constant/budget variant of its own, no calibration --
      # see that module's docstring.
    budget_cap:
      type: s_star_formula
      constant: 200
      formula: "constant * N * s_star**-2 * log(N / delta)"
      # s_star is Monte-Carlo-estimated at runtime from the constructed
      # instance (kabc.metrics.estimate_s_star_sq), not stored here; N and
      # delta are this family's own N (per sweep point) and the top-level
      # delta above. ONE budget_cap per grid point, shared identically
      # across all 6 algorithm rows and every rep at that point (unchanged
      # from the original design) -- no budget_multiplier dimension
      # anymore.
