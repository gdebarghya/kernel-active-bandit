# Experiment 3 -- MovieLens random pairs: robustness across the real-data
# pair distribution. See docs/experiments.md, "Experiment 3" section for the
# full design. Consumed by scripts/run_experiment3.py -- a dedicated script
# because every rep rebuilds a FRESH environment (a newly sampled movie
# pair), which doesn't fit a per-grid-point-env-reuse loop.

exp_id: 3
delta: 0.05
reps: 100
rep_start: 0                  # 0 = fresh run (overwrites results/exp3_3); set to the current
                                # rep count to append more reps.
seed_multiplier: 1000
seed_formula: "seed = seed_multiplier * exp_id + rep"

data_dir: data/ml-1m-207      # scripts/build_movielens_207.py's output
arms_per_prototype: 4          # N = 2 * arms_per_prototype = 8, K = 2 fixed
budget_cap: 30000              # fixed, not s_star_formula, and common to ALL algorithms.
                                # 30000 clears kabc's doubling-trick round-7 threshold
                                # (28560 at N=8, delta=0.05); an earlier cap of 15000
                                # did not (results kept as results_cap15000_backup.parquet).

n_jobs: 10                     # parallelize ACROSS REPS (not across the
                                # algorithm-rows within one rep) -- see
                                # docs/experiments.md section 0.4.

# 4 algorithm rows per (rep, version): kabc, acb, tas-fw, unif-kkm.
# tas-fw uses its own separately calibrated constant
# (configs/calibration_tas_fw.yaml, written by scripts/calibrate_tas_fw.py).
# unif-kkm is the only row with a cross-algorithm tau dependency (its budget is
# min(tau_kabc, budget_cap)), so kabc runs before it regardless of this list's
# order (enforced in scripts/run_experiment3.py).
algorithms: [kabc, acb, tas-fw, unif-kkm]

# One version only (exp3_3): B is drawn uniformly among all movies whose mean
# differs from A's by at most mean_gap_tol -- no MMD^2 cherry-picking and no
# easy mean separation. `rule: uniform` = uniform-random choice among eligible
# candidates; `comparison: le` = "|mean_A-mean_B| <= mean_gap_tol". The
# shared-candidate-order machinery in scripts/run_experiment3.py supports
# several versions per rep and still works with one.
versions:
  - name: exp3_3
    rule: uniform
    comparison: le
    mean_gap_tol: 1.0   # B drawn uniformly from all movies with |mean_A-mean_B| in [0, 1]
