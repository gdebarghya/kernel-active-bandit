# Experiment 2 -- Identical means, different shapes: nonparametric
# separation. See docs/experiments.md, "Experiment 2" section, for the full
# design. Consumed by scripts/run_experiment2.py -- a dedicated script, not
# the (now-deleted) shared run_experiment.py engine -- see that script's
# module docstring for why.
#
# `acb` rows can be regenerated alone (same instances, caps, seeds) with
# scripts/run_experiment2_acb.py (`make exp2-acb`).

exp_id: 2
delta: 0.05
reps: 100
rep_start: 0                   # 0 = fresh run (overwrites results/exp2); set to the current
                                # rep count to append more reps.
seed_multiplier: 1000
seed_formula: "seed = seed_multiplier * exp_id + rep"

n_jobs: 10                     # parallelize ACROSS REPS (not across the 5
                                # algorithm rows within one rep) -- see
                                # scripts/run_experiment2.py's module
                                # docstring for the full rationale.

# 5 rows per (grid point, rep), all independent base algorithms (kabc,
# kabc-2x, kabc-0.5x, kabc-sg, acb); no cross-algorithm tau dependency.
# kabc-0.5x/kabc-2x are a calibration-constant ablation (c_cal halved/
# doubled), not a budget variant -- see scripts/common.py's
# `_kabc_fit_2x`/`_kabc_fit_0p5x` docstrings.
ALGORITHMS: &algorithms
  [kabc, kabc-2x, kabc-0.5x, kabc-sg, acb]

# Shared budget_cap mechanism, identical to Experiment 1: one Monte-Carlo-
# estimated s*^2 per grid point, shared across all 5 algorithm rows and
# every rep at that point.
BUDGET_CAP: &budget_cap
  type: s_star_formula
  constant: 200
  formula: "constant * N * s_star**-2 * log(N / delta)"

instances:
  # (2a) Scale pair: cluster A = N(0,1), cluster B = N(0, sigma_B^2). Same
  # mean, different variance. One grid point per family (sigma_B=2).
  - family: scale_pair
    base: {N: 40}               # K=2 fixed internally by ScalePairEnv
    sweeps:
      - param: sigma_B
        values: [2]
    algorithms: *algorithms
    budget_cap: *budget_cap

  # (2b) Moment-matched mixture: cluster A = N(0,1), cluster B =
  # 0.5*N(-a,b^2) + 0.5*N(a,b^2), b^2 = 1-a^2 (matches mean AND variance;
  # only shape differs). One grid point (a=0.9).
  - family: moment_matched_mixture
    base: {N: 40}               # K=2 fixed internally
    sweeps:
      - param: a
        values: [0.9]
    algorithms: *algorithms
    budget_cap: *budget_cap

  # (2c) 2D geometry: ring (Gaussian noise 0.1, radius swept) vs N(0,I_2)
  # blob, both centered at origin. One grid
  # point (ring_radius=2).
  - family: ring_blob
    base: {N: 40, ring_noise: 0.1}   # K=2 fixed internally
    sweeps:
      - param: ring_radius
        values: [2]
    algorithms: *algorithms
    budget_cap: *budget_cap
