# Experiment 4 -- MovieLens prototypes: kabc's decision rule (pairwise
# threshold + connected components) vs. unif-kkm's k-means under real
# heterogeneous difficulty and cluster-size imbalance, with acb as an
# additional baseline. See docs/experiments.md, "Experiment 4" section.
#
# Two resampled real-data settings (every rep draws a fresh instance, as in
# Experiment 3's exp3_3). unif-kkm runs at kabc's own realized budget
# (matched-budget: isolates the decision rule from sampling allocation); acb
# runs at the same budget_cap as kabc.
#
# MEMORY GUARD OVERRIDE: this experiment runs at n_jobs=5 and passes
# memory_guard_n_workers=5, memory_guard_safety_factor=2 to kabc.fit (additive,
# opt-in; see src/kabc/algorithms/kabc.py). Verified by measurement (~628 MB
# peak RSS per worker at k=8 scale, 5 concurrent processes, no new swapping).
# This raises the honest convergence ceiling to doubling round k=8 for both
# settings; k=9 would need ~14.5 GiB at 5 workers and was not pursued.
# Experiments 1-3 keep the default 11-worker/4x assumption.

exp_id: 4
delta: 0.05
reps: 100                      # all 100 reps complete (kabc/unif-kkm/acb); reps 0-49, 50-79, 80-99 were run in turn
rep_start: 100                 # no-op while equal to `reps`; raise `reps` to append more reps
                                # reps (kabc/unif-kkm via scripts.run_experiment4)
seed_multiplier: 1000
seed_formula: "seed = seed_multiplier * exp_id + rep"

data_dir: data/ml-1m-207
n_jobs: 5                      # lower than Experiments 1-3 to give the memory guard
                                # verified margin at k=8 (see header comment)

algorithms: [kabc, unif-kkm, acb]  # all three run in scripts/run_experiment4.py (kabc first;
                                  # unif-kkm is budget-matched to kabc's tau). The ACB-only script
                                  # scripts/run_experiment4_acb.py (`make exp4-acb`) can regenerate
                                  # acb rows alone on the same instances.

memory_guard:
  n_workers: 5                 # matches n_jobs above
  safety_factor: 2              # measured overhead ratio was ~1.3x; 2x keeps margin above it

conditions:
  # Setting 1 -- baseline: K=7, N=40. Close pair has mean gap <= 0.25, far
  # pair >= 0.5, uniform pick among eligible candidates; generic anchors are
  # unconstrained uniform draws. budget_cap covers k=8's full cumulative cost
  # (360,520 at N=40).
  baseline:
    counts_by_role:
      far_large: 12
      far_small: 2
      close_a: 5
      close_b: 4
      generic_1: 8
      generic_2: 6
      generic_3: 3
    close_mean_gap_tol: 0.25
    far_mean_gap_min: 0.5
    budget_cap: 400000

  # Setting 2 -- amplified imbalance: same resampling mechanism with K=12
  # (N=76) and a 20:2 far pair, stressing the size-imbalance mechanism harder.
  # budget_cap covers k=8's full cumulative cost (735,148 at N=76).
  amplified_imbalance:
    counts_by_role:
      far_large: 20
      far_small: 2
      close_a: 5
      close_b: 4
      generic_1: 10
      generic_2: 8
      generic_3: 7
      generic_4: 6
      generic_5: 5
      generic_6: 4
      generic_7: 3
      generic_8: 2
    close_mean_gap_tol: 0.25
    far_mean_gap_min: 0.5
    budget_cap: 800000
