# Experiment 4 -- MovieLens prototypes: kabc's decision rule (pairwise
# threshold + connected components) vs. unif-kkm's k-means under real
# heterogeneous difficulty and cluster-size imbalance. See
# docs/experiments.md, "Experiment 4" section for the full design,
# including the real-data verification behind every number below.
#
# CLEAN REDESIGN (2026-09-16), replacing the earlier 4-condition/6-algorithm
# version entirely (that version's own docs/notebook/results are superseded,
# not merged with this one): two algorithms only (kabc, unif-kkm-1x,
# matched-budget -- isolates the decision rule from sampling allocation, the
# one comparison this experiment actually needs), two resampled real-data
# settings (no hand-picked "fixed" instance, no track_a/track_b scale
# variants -- both replaced by settings that resample every rep, mirroring
# Experiment 3's exp3_3 mechanism).
#
# MEMORY GUARD OVERRIDE, real-verified (not just the formula): this
# experiment runs at n_jobs=5 (not the 10-11 Experiments 1-3 use) and passes
# memory_guard_n_workers=5, memory_guard_safety_factor=2 to kabc.fit's own
# (additive, opt-in) override -- see src/kabc/algorithms/kabc.py's `_fit`
# docstring. This raises the safe per-iteration sample ceiling from n_k~2852
# (the original 11-worker/4x-safety design) to n_k~5982, verified via real
# measurement, not just the relaxed formula: a real k=8-scale computation
# (n~4600, all pairs, N=40) measured 627.7 MB actual peak RSS per worker
# (vs. the pure 3-Gram-matrix model's 484.9 MB -- a real ~1.3x overhead
# ratio, comfortably covered by the 2x safety factor used here); 5 REAL
# concurrent OS processes at this scale were also verified (peak RSS
# 626.4-626.5 MB each, sum 3.06 GiB, wall-clock 1242.4s) with `vm_stat`
# confirming ZERO new swapouts during the run (before: 10,429,231, after:
# 10,429,231) -- no thrashing, not merely "under the formula's ceiling".
# This override applies ONLY to this experiment's own kabc.fit calls
# (scripts/common.py's `_kabc_fit` passthrough) -- Experiments 1-3 keep the
# original, unchanged 11-worker/4x assumption.
#
# This raises kabc's honest convergence ceiling from k<=7 to k<=8 for both
# settings below (k=9 would need n_k~9200-9900, verified NOT safe at 5
# workers -- real projected memory ~14.5 GiB, too close to this machine's
# 16GB target -- see docs/experiments.md for the full real-data projection
# and why k=9 was not pursued).

exp_id: 4
delta: 0.05
reps: 50                       # COMPLETE (2026-09-17): full 50-rep run finished for both
                                # settings, clean exit, no errors -- results/exp4_baseline/
                                # results.parquet and results/exp4_amplified_imbalance/
                                # results.parquet each hold 100 rows (50 reps x 2 algorithms).
                                # PILOT (reps=5, rep_start=0, 2026-09-16) ran first: 5/5 reps,
                                # 7671.9s wall-clock (n_jobs=5), amplified_imbalance hit k=8 in
                                # 5/5 reps -- real projected full-50 wall-clock ~21.3h (not a
                                # naive "~2x" estimate); production run of the remaining 45
                                # reps then took 67144.2s (~18.65h), consistent with that
                                # projection. READY FOR A FUTURE EXTENSION: rep_start below is
                                # set to the CURRENT rep count (50), a safe no-op as-is (see
                                # configs/exp1.yaml's identical convention) -- raise `reps`
                                # above to append more via the same resume mechanism.
rep_start: 50
seed_multiplier: 1000
seed_formula: "seed = seed_multiplier * exp_id + rep"

data_dir: data/ml-1m-207
n_jobs: 5                      # reduced from 10-11 specifically to give the memory guard
                                # real, verified margin at k=8 -- see the module-level
                                # comment above and docs/experiments.md

algorithms: [kabc, unif-kkm-1x]  # matched-budget only -- isolates the decision rule
                                  # from sampling allocation, the one comparison this
                                  # experiment needs (see docs/experiments.md)

memory_guard:
  n_workers: 5                 # matches n_jobs above exactly (not a conservative
                                # over-estimate like Experiments 1-3's 11-vs-10 margin --
                                # this experiment's own real n_jobs, real-verified)
  safety_factor: 2              # real measured overhead ratio was ~1.3x; 2x keeps
                                # genuine margin above that without the original
                                # design's unverified 4x padding

conditions:
  # ---------------------------------------------------------------------
  # Setting 1 -- realistic resampled baseline: same K=7 role/count
  # structure as the prior design's `resampled` condition, same mean-gap
  # mechanism (close pair <=0.25, far pair >=0.5, uniform pick among
  # eligible -- mirrors Experiment 3's exp3_3, not MMD^2 cherry-picking).
  # budget_cap raised to comfortably clear k=8's full cumulative cost
  # (360,520 at N=40), removing the prior design's cap-driven truncation
  # at k=7 (176,440) -- kabc's own doubling schedule, not an arbitrary
  # number: k=9's cumulative would be far beyond both this budget and the
  # memory guard, so this is a genuine, honest k<=8 ceiling, not a cap
  # papering over a deeper limit.
  # ---------------------------------------------------------------------
  baseline:
    counts_by_role:
      far_large: 12
      far_small: 2
      close_a: 5
      close_b: 4
      generic_1: 8
      generic_2: 6
      generic_3: 3
    close_mean_gap_tol: 0.25
    far_mean_gap_min: 0.5
    budget_cap: 400000

  # ---------------------------------------------------------------------
  # Setting 2 -- amplified imbalance: same mean-gap resampling mechanism,
  # but K=12 (not 7) and a far pair ratio of 20:2 (10:1, not 12:2's 6:1) --
  # the regime where the prior design's `track_a` (K=12, more clusters)
  # showed the cleanest imbalance-specific signal (unif-kkm's ari_far_pair
  # consistently below ari_close_pair, misclass_rate_small ~1.6-2x
  # misclass_rate_large), stressing that same mechanism harder. Generic
  # anchor count/sizes reuse track_a's own real, catalog-verified values
  # (10,8,7,6,5,4,3,2) -- NOT a fixed instance here, though: every rep still
  # resamples which real movies fill every role, generic anchors included
  # (unconstrained, uniform draw), so per-rep difficulty will vary more
  # than track_a's single fixed instance did -- expected, not a bug, and
  # the fixed budget_cap below is exactly the mechanism that keeps an
  # occasional harder-than-usual draw a graceful near-miss, not a crash.
  # budget_cap covers k=8's full cumulative cost (735,148 at N=76) with
  # comparable proportional margin to Setting 1.
  # ---------------------------------------------------------------------
  amplified_imbalance:
    counts_by_role:
      far_large: 20
      far_small: 2
      close_a: 5
      close_b: 4
      generic_1: 10
      generic_2: 8
      generic_3: 7
      generic_4: 6
      generic_5: 5
      generic_6: 4
      generic_7: 3
      generic_8: 2
    close_mean_gap_tol: 0.25
    far_mean_gap_min: 0.5
    budget_cap: 800000
